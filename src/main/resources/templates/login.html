<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* Background */
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Glassmorphic Card with Dual Color */
        .card {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.15), rgba(170, 102, 204, 0.3));
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-in-out;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            animation: slideInDown 1s ease-in-out;
        }

        /* Input Fields */
        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px;
            color: white;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            border: none;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(to right, #ff9966, #ff5e62);
            border: none;
            padding: 10px;
            font-size: 18px;
            width: 100%;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #ff5e62, #ff9966);
            box-shadow: 0px 5px 15px rgba(255, 94, 98, 0.4);
        }

        /* Error Message */
        .text-danger {
            background: rgba(255, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            animation: shake 0.5s ease-in-out;
        }

        /* Register Link */
        .register-link {
            margin-top: 10px;
            font-size: 14px;
            color: white;
        }

        .register-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .register-link a:hover {
            color: #ffea00;
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2><i class="fas fa-user-circle"></i> Login</h2>

        <!-- Display error message if exists -->
        <div th:if="${param.error}" class="text-danger mb-3">
            <p th:text="'Invalid credentials. Please try again.'"></p>
        </div>

        <!-- Login form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="register-link mt-3">Don't have an account? <a href="/register">Register here</a></p>
    </div>

</body>
</html>
