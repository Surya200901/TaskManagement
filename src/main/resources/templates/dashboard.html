<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1E3A8A, #4F46E5);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-bottom: 4px solid #4F46E5;
        }

        /* Navigation Bar */
        nav {
            background: #6D28D9;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }

        nav ul li a:hover {
            background: #9333EA;
            transform: scale(1.1);
        }

        /* Welcome Section */
        .welcome-section {
            text-align: center;
            background: #60A5FA;
            color: white;
            padding: 30px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .welcome-section h1 {
            font-size: 28px;
        }

        /* Task Statistics */
        .task-stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            flex: 1;
            transition: transform 0.3s ease-in-out;
        }

        .stat-card:hover {
            transform: translateY(-10px);
        }

        .stat-card i {
            font-size: 40px;
            color: #4F46E5;
            margin-bottom: 10px;
        }

        .stat-card h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 16px;
            color: #555;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            background: #E5E7EB;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
            margin: 10px 0;
        }

        .progress-bar .progress {
            height: 100%;
            background: #4F46E5;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }

        /* Task Table */
        .task-section {
            background: #D1D5DB;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        table th, table td {
            padding: 15px;
            text-align: center;
        }

        table th {
            background: #4B5563;
            color: white;
        }

        table tbody tr:hover {
            background: #22D3EE;
            transition: background 0.3s ease-in-out;
        }

        /* Checkbox */
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
        }

        /* Footer */
        footer {
            background: #1E3A8A;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-top: 4px solid #4F46E5;
        }
    </style>
</head>

<body>

    <header>
        <h1><i class="fas fa-tasks"></i> Task Management Dashboard</h1>
    </header>

    <nav>
        <ul>
            <li><a href="/task/task"><i class="fas fa-list"></i> Add Task</a></li>
            <li><a href="/profile"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="/login"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="welcome-section">
        <h1>Welcome, <span th:text="${user?.username}"></span>!</h1>
        <p>Manage your tasks and track your progress from here.</p>
    </div>

    <!-- Task Statistics -->
    <div class="task-stats">
        <div class="stat-card">
            <i class="fas fa-tasks"></i>
            <h3>Total Tasks</h3>
            <p th:text="${totalTasks}">0</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <h3>Completed Tasks</h3>
            <p th:text="${completedTasks}">0</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-clock"></i>
            <h3>Pending Tasks</h3>
            <p th:text="${pendingTasks}">0</p>
        </div>
    </div>

    <!-- Task Progress Section -->
    <div class="task-stats">
        <h2><i class="fas fa-chart-line"></i> Task Progress</h2>
        <div class="progress-bar">
            <div class="progress" th:style="'width:' + ${progress} + '%;'" th:text="${progress} + '%'"></div>
        </div>
    </div>

    <!-- Task Table -->
    <div class="task-section">
        <h2><i class="fas fa-clipboard-list"></i> Your Tasks</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Deadline</th>
                    <th>Priority</th>
                    <th>Completed</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.title}"></td>
                    <td th:text="${task.description}"></td>
                    <td th:text="${task.deadline}"></td>
                    <td th:text="${task.priority}"></td>
                    <td><input type="checkbox" th:checked="${task.completed}" disabled></td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <p>Task Management System © 2025</p>
    </footer>

</body>

</html>
