<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #6200ea;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ffd600;
        }

        section {
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #6200ea;
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        form input:focus, form textarea:focus {
            border-color: #6200ea;
            outline: none;
        }

        form button {
            background-color: #6200ea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #3700b3;
        }

        .success-message {
            color: green;
            font-weight: bold;
            margin-bottom: 20px;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #6200ea;
            color: white;
            margin-top: 40px;
        }

        .profile-details {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
            border: 1px solid #ddd;
            animation: fadeIn 1s ease-in-out;
        }

        .profile-details p {
            margin: 10px 0;
        }

        .profile-details strong {
            color: #6200ea;
        }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-user-circle"></i> User Profile</h1>
    <nav>
        <ul>
            <li><a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>
</header>

<section>
    <h2><i class="fas fa-id-card"></i> Profile Details</h2>

    <!-- Success Message -->
    <p th:if="${profileUpdated}" class="success-message">
        <i class="fas fa-check-circle"></i> Profile updated successfully!
    </p>

    <form id="profileForm" th:action="@{/profile/update}" method="post" th:object="${profile}" onsubmit="return validateForm()">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{user.id}"/>

        <label><i class="fas fa-user"></i> Username:</label>
        <input type="text" th:field="*{user.username}" readonly />

        <label><i class="fas fa-user-tag"></i> Full Name:</label>
        <input type="text" th:field="*{fullName}" required />

        <label><i class="fas fa-envelope"></i> Email:</label>
        <input type="email" th:field="*{email}" required />

        <label><i class="fas fa-phone"></i> Phone:</label>
        <input type="text" th:field="*{phone}" required />

        <label><i class="fas fa-map-marker-alt"></i> Address:</label>
        <textarea th:field="*{address}" required></textarea>

        <button type="submit"><i class="fas fa-save"></i> Update Profile</button>
    </form>

    <!-- Display Updated Profile Below Button -->
    <div class="profile-details">
        <h3><i class="fas fa-info-circle"></i> Updated Profile Details:</h3>
        <p><strong>Full Name:</strong> <span th:text="${profile.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${profile.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${profile.phone}"></span></p>
        <p><strong>Address:</strong> <span th:text="${profile.address}"></span></p>
    </div>

</section>

<footer>
    <p>Task Management System © 2025</p>
</footer>

<!-- JavaScript for Form Validation -->
<script>
    function validateForm() {
        const fullName = document.querySelector('input[name="fullName"]').value.trim();
        const email = document.querySelector('input[name="email"]').value.trim();
        const phone = document.querySelector('input[name="phone"]').value.trim();
        const address = document.querySelector('textarea[name="address"]').value.trim();

        if (!fullName || !email || !phone || !address) {
            alert("All fields are required!");
            return false;
        }

        if (!/^\S+@\S+\.\S+$/.test(email)) {
            alert("Please enter a valid email address.");
            return false;
        }

        if (!/^\d{10}$/.test(phone)) {
            alert("Please enter a valid 10-digit phone number.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
