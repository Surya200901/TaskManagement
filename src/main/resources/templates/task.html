<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Task Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1E3A8A, #4F46E5);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-bottom: 4px solid #4F46E5;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        /* Navigation */
        nav ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        nav ul li a:hover {
            background: #9333EA;
            transform: scale(1.1);
        }

        /* Main Content */
        h2 {
            text-align: center;
            color: #1E3A8A;
            margin: 20px 0;
            font-size: 24px;
        }

        /* Form Styles */
        form {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            color: #4F46E5;
        }

        input[type="text"],
        textarea,
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease-in-out;
        }

        input[type="text"]:focus,
        textarea:focus,
        input[type="datetime-local"]:focus,
        select:focus {
            border-color: #4F46E5;
            outline: none;
        }

        button[type="submit"] {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        button[type="submit"]:hover {
            background: #1E3A8A;
            transform: scale(1.05);
        }

        /* Task Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: slideIn 1s ease-in-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        table th, table td {
            padding: 15px;
            text-align: center;
        }

        table th {
            background: #4B5563;
            color: white;
        }

        table tbody tr {
            transition: background 0.3s ease-in-out;
        }

        table tbody tr:hover {
            background: #E0E7FF;
        }


        /* Checkbox */
        input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
        }
		
		/* Ensuring input fields and title stay inside the container */
		    .task-container {
		        max-width: 600px;
		        margin: auto;
		        padding: 20px;
		        background: white;
		        border-radius: 10px;
		        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		        overflow: hidden;
		    }

		    input, textarea, select {
		        width: 100%;
		        box-sizing: border-box;
		    }

		    /* Priority-based colors */
		    .task-priority-high {
		        background-color: #ffcccc;
		    }

		    .task-priority-medium {
		        background-color: #fff3cd;
		    }

		    .task-priority-low {
		        background-color: #d4edda;
		    }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.5s ease-in-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: #1E3A8A;
            margin-bottom: 15px;
        }

        .modal-footer {
            text-align: right;
            margin-top: 15px;
        }

        .modal-footer button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .modal-footer button:hover {
            background: #1E3A8A;
        }

        /* Footer */
        footer {
            background: #1E3A8A;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-top: 4px solid #4F46E5;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-tasks"></i> Task Management</h1>
        <nav>
            <ul>
                <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="/task/task"><i class="fas fa-plus-circle"></i> Tasks</a></li>
                <li><a href="/login"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>
    </header>
	
	<div class="task-container">
    <h2>Create Task</h2>
    <form th:action="@{/task/create}" method="POST">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" required><br><br>

        <label for="description">Description:</label>
        <textarea name="description" id="description" required></textarea><br><br>

        <label for="deadline">Deadline:</label>
        <input type="datetime-local" name="deadline" id="deadline" required><br><br>

        <label for="category">Category:</label>
        <input type="text" name="category" id="category" required><br><br>

        <label for="priority">Priority:</label>
        <select name="priority" id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select><br><br>

        <button type="submit">Create Task</button>
    </form>
	</div>

    <h2>Task List</h2>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Deadline</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Completed</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}" th:id="'task-' + ${task.id}">
                <td class="task-title" th:text="${task.title}"></td>
                <td class="task-description" th:text="${task.description}"></td>
                <td class="task-deadline" th:text="${task.deadline}"></td>
                <td class="task-category" th:text="${task.category}"></td>
                <td class="task-priority" th:text="${task.priority}"></td>
                <td>
                    <input type="checkbox" th:checked="${task.completed}"
                           th:id="'completed-' + ${task.id}" 
                           th:onclick="'updateCompletionStatus(' + ${task.id} + ')'" />
                </td>
                <td>
                    <button type="button" th:onclick="'editTask(\'' + ${task.id} + '\')'"> Edit</button>
					<a th:href="@{/task/delete/{id}(id=${task.id})}" onclick="return confirmDelete(event, this)"> Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <footer>
        <p>Task Management System © 2025</p>
    </footer>

    <!-- Modal for editing task -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-body">
                <form id="editTaskForm">
                    <input type="hidden" id="editTaskId">
                    <label for="editTitle">Title:</label>
                    <input type="text" id="editTitle" required><br><br>

                    <label for="editDescription">Description:</label>
                    <textarea id="editDescription" required></textarea><br><br>

                    <label for="editDeadline">Deadline:</label>
                    <input type="datetime-local" id="editDeadline" required><br><br>

                    <label for="editCategory">Category:</label>
                    <input type="text" id="editCategory" required><br><br>

                    <label for="editPriority">Priority:</label>
                    <select id="editPriority">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select><br><br>
                </form>
            </div>
            <div class="modal-footer">
                <button onclick="saveTask()">Save</button>
                <button onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("editModal");

        function editTask(id) {
            const taskRow = document.getElementById(`task-${id}`);
            if (taskRow) {
                document.getElementById("editTaskId").value = id;
                document.getElementById("editTitle").value = taskRow.querySelector(".task-title").textContent.trim();
                document.getElementById("editDescription").value = taskRow.querySelector(".task-description").textContent.trim();
                document.getElementById("editDeadline").value = taskRow.querySelector(".task-deadline").textContent.trim();
                document.getElementById("editCategory").value = taskRow.querySelector(".task-category").textContent.trim();
                document.getElementById("editPriority").value = taskRow.querySelector(".task-priority").textContent.trim();

                modal.style.display = "flex";
            } else {
                alert("Task not found!");
            }
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function saveTask() {
            const id = document.getElementById("editTaskId").value;
            const title = document.getElementById("editTitle").value;
            const description = document.getElementById("editDescription").value;
            const deadline = document.getElementById("editDeadline").value;
            const category = document.getElementById("editCategory").value;
            const priority = document.getElementById("editPriority").value;

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;

            fetch(`/task/update/${id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": csrfToken
                },
                body: JSON.stringify({ title, description, deadline, category, priority })
            })
            .then(response => {
                if (response.ok) {
                    alert("Task updated successfully!");
                    location.reload();
                } else {
                    alert("Failed to update task.");
                }
            })
            .catch(error => console.error("Error updating task:", error))
            .finally(() => closeModal());
        }

        function updateCompletionStatus(id) {
            const checkbox = document.getElementById("completed-" + id);
            const completed = checkbox.checked;

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            fetch(`/task/update-completed/${id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ completed })
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                location.reload();
            })
            .catch(error => console.error("Error updating task status:", error));
        }
		
		function confirmDelete(event, element) {
		        event.preventDefault(); // Prevent immediate deletion
		        let confirmation = confirm("Are you sure you want to delete this task?");
		        if (confirmation) {
		            window.location.href = element.href; // Proceed with deletion
		        }
		    }
			
    </script>
</body>
</html>
